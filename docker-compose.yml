services:
  app:
    build: .
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8899
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/myblog?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_KEY: ${SESSION_KEY:-myblog}
    ports:
      - "8899:8899"
    volumes:
      - ./public/img:/app/public/img
      - ./logs:/app/logs
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:3.4.4
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    command: ["mongod", "--bind_ip", "0.0.0.0", "--auth"]
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:6.2.21
    restart: always
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
